name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check firebase-config.js
          node --input-type=module --check < firebase-auth.js
      - name: Check required PWA files
        run: |
          test -f index.html
          test -f app.css
          test -f app.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f icon.svg
          test -f mark.svg
          test -f logo.svg
          test -f icon-192.png
          test -f icon-512.png
      - name: Build Capacitor mobile web bundle
        run: |
          npm install
          npm run build:mobile
          test -f dist/index.html
          test -f dist/mobile.js
      - name: Check event-listener element IDs
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('app.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          const ids=[...js.matchAll(/\$\("([^"]+)"\)\.addEventListener/g)].map(m=>m[1]);
          const missing=[...new Set(ids.filter(id=>!html.includes('id="'+id+'"')))];
          if(missing.length){
            console.error('Missing listener target IDs:', missing.join(', '));
            process.exit(1);
          }
          console.log('All listener target IDs exist.');
          NODE
