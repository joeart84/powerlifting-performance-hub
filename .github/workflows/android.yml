name: Android build and device smoke test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install dependencies and generate Android platform
        run: |
          npm ci
          npm test
          npm run android:init
      - name: Build APK, unsigned AAB and Android lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease lintDebug
      - name: Check bundle native libraries for 16 KB support
        run: python3 scripts/check-android-bundle.py android/app/build/outputs/bundle/release/app-release.aab
      - name: Save Android build outputs
        uses: actions/upload-artifact@v4
        with:
          name: hub-android-0.14.1-test-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-debug.html
          retention-days: 14
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installed app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Save device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-android-device-tests
          path: android/app/build/reports/androidTests/connected/
